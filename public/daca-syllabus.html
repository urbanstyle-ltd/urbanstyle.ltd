    .detail-panel {
      position: fixed; top: 0; right: -500px; width: 480px; height: 100vh;

    .detail-overlay {

    .zoom-btn:hover { transform: scale(1.05); }
    .zoom-btn.active { box-shadow: 0 0 0 2px #009B8D; }

    .sprint-card {
      border: 2px solid #E5E7EB; border-radius: 12px; padding: 16px;
      transition: all 0.2s; cursor: pointer;

    .sprint-card:hover { border-color: #009B8D; box-shadow: 0 4px 12px rgba(0,155,141,0.15); }

<script>
let currentView = 'meeting';
let currentZoom = 'week';
let expandedCategories = new Set(['core', 'production', 'components', 'google']);
let highlightedWeek = null;
let walkthroughActive = false;
let walkthroughWeek = 0;
let activeFilters = { sprint: null, character: null, shuHaRi: null };

// ============ UTILITY FUNCTIONS ============

function isSprintBoundary(weekId) {
  const sprint = PROGRAM_DATA.sprints.find(s => s.weeks.includes(weekId));
  return sprint ? sprint.weeks[sprint.weeks.length - 1] === weekId : false;
}
function getSprintForWeek(weekId) {
  return PROGRAM_DATA.sprints.find(s => s.weeks.includes(weekId));
}
function shuHaRiBadge(level) {
  const cls = level.startsWith('Shu') ? 'badge-shu' : level.startsWith('Ha') ? 'badge-ha' : 'badge-ri';
  return `<span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-semibold ${cls}">${level}</span>`;
}
function statusBadge(done) {
  return done
    ? `<span class="badge-done px-1.5 py-0.5 rounded font-semibold">VALMIS</span>`
    : `<span class="badge-todo px-1.5 py-0.5 rounded font-semibold">PUUDU</span>`;
}
function progressBar(done, total) {
  const pct = Math.round((done / total) * 100);
  const color = pct === 100 ? '#10B981' : pct >= 50 ? '#F59E0B' : '#EF4444';
  return `<div class="flex items-center gap-1">
    <div class="w-16 h-2 bg-gray-200 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${color}"></div></div>
    <span class="text-[9px] font-medium">${done}/${total}</span>
  </div>`;
}

function getFilteredWeeks() {
  let weeks = PROGRAM_DATA.weeks;
  if (activeFilters.sprint !== null) {
    const sprint = PROGRAM_DATA.sprints[activeFilters.sprint];
    weeks = weeks.filter(w => sprint.weeks.includes(w.id));
  }
  if (activeFilters.character !== null) {
    const char = PROGRAM_DATA.characters[activeFilters.character];
    weeks = weeks.filter(w => char.weeks.includes(w.id));
  }
  if (activeFilters.shuHaRi !== null) {
    const level = activeFilters.shuHaRi;
    weeks = weeks.filter(w => w.shuHaRi.startsWith(level));
  }
  return weeks;
}

// ============ INIT ============

function init() {
  const d = PROGRAM_DATA;
  document.getElementById('programTitle').textContent = d.program.name;
  document.getElementById('programSub').textContent = `${d.program.provider} | ${d.program.company} | ${d.program.duration}`;
  document.getElementById('footerDate').textContent = `Uuendatud: ${d.program.updated}`;
  renderProductionBar();
  renderViewButtons();
  renderFilters();
  renderZoomButtons();
  render();
}

// ============ ZOOM ============

function setZoom(level) {
  currentZoom = level;
  renderZoomButtons();
  render();
}

function renderZoomButtons() {
  document.getElementById('zoomSprint').className = `zoom-btn px-2 py-1 rounded text-[10px] font-medium ${currentZoom === 'sprint' ? 'bg-teal text-white active' : 'text-gray-300 hover:text-white'}`;
  document.getElementById('zoomWeek').className = `zoom-btn px-2 py-1 rounded text-[10px] font-medium ${currentZoom === 'week' ? 'bg-teal text-white active' : 'text-gray-300 hover:text-white'}`;
}

function render() {
  if (currentZoom === 'sprint') {
    document.getElementById('sprintOverview').classList.remove('hidden');
    document.getElementById('tableWrapper').classList.add('hidden');
    renderSprintOverview();
  } else {
    document.getElementById('sprintOverview').classList.add('hidden');
    document.getElementById('tableWrapper').classList.remove('hidden');
    renderTable();
  }
}

// ============ SPRINT OVERVIEW ============

function renderSprintOverview() {
  const container = document.getElementById('sprintOverview');
  const weeks = getFilteredWeeks();
  let html = '<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">';

  PROGRAM_DATA.sprints.forEach(sprint => {
    const sprintWeeks = weeks.filter(w => sprint.weeks.includes(w.id));
    if (sprintWeeks.length === 0) return;

    const allDone = sprintWeeks.every(w => Object.values(w.productionStatus).every(v => v));
    const shuLevels = [...new Set(sprintWeeks.map(w => w.shuHaRi))].join(', ');
    const characters = [...new Set(sprintWeeks.map(w => w.character))].join('; ');
    const tools = [...new Set(sprintWeeks.flatMap(w => w.tools))];

    html += `<div class="sprint-card" onclick="drillIntoSprint(${sprint.id})" style="border-left: 4px solid ${sprint.color}">
      <div class="flex items-center justify-between mb-2">
        <div>
          <span class="text-[10px] font-bold text-gray-400">SPRINT ${sprint.id}</span>
          <h3 class="font-bold text-base">${sprint.name}</h3>
        </div>
        <div class="text-right">
          ${sprintWeeks.map(w => `<span class="text-[10px] bg-gray-100 px-1.5 py-0.5 rounded mr-0.5">N${w.id}</span>`).join('')}
        </div>
      </div>
      <p class="text-xs text-gray-500 mb-3">${sprint.description}</p>
      <div class="space-y-2 text-[11px]">
        <div class="flex justify-between"><span class="text-gray-500">Shu-Ha-Ri:</span> <span class="font-medium">${shuLevels}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Tegelased:</span> <span class="font-medium">${characters}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Kontakttunnid:</span> <span class="font-bold text-teal">${sprintWeeks.length * 6} ak.t</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Materjalid:</span> ${allDone ? '<span class="text-green-600 font-bold">100% VALMIS</span>' : '<span class="text-yellow-600 font-bold">Pooleli</span>'}</div>
      </div>

      <div class="mt-3 border-t pt-2">
        <div class="text-[10px] font-semibold text-gray-400 mb-1">N\u00E4dalate teemad:</div>
        ${sprintWeeks.map(w => `
          <div class="flex items-start gap-2 mb-1">
            <span class="text-[9px] font-bold text-gray-400 mt-0.5">N${w.id}</span>
            <div>
              <div class="text-[10px] font-medium">${w.name}</div>
              <div class="text-[9px] text-gray-500">${w.sessions.s1.topic.substring(0, 60)}${w.sessions.s1.topic.length > 60 ? '...' : ''}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="mt-3 border-t pt-2">
        <div class="text-[10px] font-semibold text-gray-400 mb-1">Portfoolio artefaktid:</div>
        ${sprintWeeks.map(w => `
          <div class="text-[9px] text-swim-green"><span class="font-bold">N${w.id}:</span> ${w.portfolio.artifact}</div>
        `).join('')}
      </div>

      <div class="mt-2 flex flex-wrap gap-1">
        ${tools.slice(0, 6).map(t => `<span class="text-[8px] bg-gray-100 px-1.5 py-0.5 rounded">${t}</span>`).join('')}
        ${tools.length > 6 ? `<span class="text-[8px] text-gray-400">+${tools.length - 6}</span>` : ''}
      </div>

      <div class="mt-3 border-t pt-2">
        <div class="text-[10px] font-semibold mb-1" style="color:#4285F4">\uD83C\uDF93 Google e-\u00F5pe (vabatahtlik):</div>
        ${sprintWeeks.map(w => {
          const ge = PROGRAM_DATA.googleEStudy.find(g => g.weekId === w.id);
          return ge ? `<div class="text-[9px] text-gray-600"><span class="font-bold">N${w.id}:</span> ${ge.course} \u2014 ${ge.title}</div>` : '';
        }).join('')}
      </div>
    </div>`;
  });

  html += '</div>';
  container.innerHTML = html;
}

function drillIntoSprint(sprintId) {
  activeFilters.sprint = sprintId;
  currentZoom = 'week';
  renderZoomButtons();
  renderFilters();
  render();
}

// ============ FILTERS ============

function renderFilters() {
  // Sprint filters
  const sf = document.getElementById('sprintFilters');
  sf.innerHTML = PROGRAM_DATA.sprints.map(s =>
    `<span class="filter-pill ${activeFilters.sprint === s.id ? 'active' : ''}" onclick="toggleFilter('sprint', ${s.id})" style="${activeFilters.sprint === s.id ? '' : `border-color: ${s.color}40; color: ${s.color}`}">S${s.id}: ${s.name}</span>`
  ).join('');

  // Character filters
  const cf = document.getElementById('characterFilters');
  cf.innerHTML = PROGRAM_DATA.characters.map((c, i) =>
    `<span class="filter-pill ${activeFilters.character === i ? 'active' : ''}" onclick="toggleFilter('character', ${i})" style="${activeFilters.character === i ? '' : `border-color: ${c.color}40; color: ${c.color}`}">${c.name.split(' ')[0]}</span>`
  ).join('');

  // Shu-Ha-Ri filters
  const shf = document.getElementById('shuHaRiFilters');
  shf.innerHTML = ['Shu', 'Ha', 'Ri'].map(l => {
    const cls = l === 'Shu' ? 'badge-shu' : l === 'Ha' ? 'badge-ha' : 'badge-ri';
    return `<span class="filter-pill ${activeFilters.shuHaRi === l ? 'active' : cls}" onclick="toggleFilter('shuHaRi', '${l}')" style="${activeFilters.shuHaRi === l ? '' : ''}">${l}</span>`;
  }).join('');
}

function toggleFilter(type, value) {
  activeFilters[type] = activeFilters[type] === value ? null : value;
  renderFilters();
  render();
}

function clearFilters() {
  activeFilters = { sprint: null, character: null, shuHaRi: null };
  renderFilters();
  render();
}

// ============ PRODUCTION BAR ============

function renderProductionBar() {
  const ps = PROGRAM_DATA.productionSummary;
  const items = [
    { label: 'Masterid', ...ps.masters },
    { label: 'RAG', ...ps.rags },
    { label: 'Mentorijuhendid', ...ps.mentorGuides },
    { label: 'Refleksioonivormid', ...ps.reflectionForms },
    { label: 'T\u00F6\u00F6vihikud', ...ps.workbooks },
    { label: 'Grupit\u00F6\u00F6 handout', ...ps.groupWorkHandouts },
    { label: 'Vastused', ...ps.answerKeys },
    { label: 'Bridge e-kirjad', ...ps.bridgeNarratives },
    { label: 'DOCX', ...ps.docx },
  ];
  const totalDone = items.reduce((s, i) => s + i.done, 0);
  const totalAll = items.reduce((s, i) => s + i.total, 0);
  const pct = Math.round((totalDone / totalAll) * 100);

  let html = `<div class="flex flex-wrap items-center gap-3 text-xs">`;
  html += `<div class="font-bold text-navy">Tootmise seis: <span class="text-teal">${totalDone}/${totalAll} (${pct}%)</span></div>`;
  items.forEach(item => {
    const color = item.done === item.total ? 'text-green-600' : item.done > 0 ? 'text-yellow-600' : 'text-red-500';
    const tip = item.detail ? ` title="${item.detail}"` : '';
    html += `<div class="${color} font-medium cursor-default"${tip}>${item.label}: ${item.done}/${item.total}</div>`;
  });
  html += `</div>`;
  document.getElementById('productionBar').innerHTML = html;
}

// ============ VIEW BUTTONS ============

function renderViewButtons() {
  const container = document.getElementById('viewButtons');
  container.innerHTML = '';
  for (const [key, mode] of Object.entries(VIEW_MODES)) {
    const btn = document.createElement('button');
    btn.className = `px-3 py-1.5 rounded text-xs font-medium transition-colors ${
      currentView === key ? 'bg-teal text-white' : 'bg-white/10 text-gray-200 hover:bg-white/20'
    }`;
    btn.textContent = mode.label;
    btn.title = mode.desc;
    btn.onclick = () => { currentView = key; renderViewButtons(); render(); };
    container.appendChild(btn);
  }
}

// ============ WALKTHROUGH ============

function toggleWalkthrough() {
  walkthroughActive = !walkthroughActive;
  const bar = document.getElementById('walkthroughBar');
  const btn = document.getElementById('walkthroughBtn');
  if (walkthroughActive) {
    bar.classList.remove('hidden');
    btn.classList.add('bg-teal', 'text-white');
    btn.classList.remove('bg-white/10', 'text-gray-200');
    document.getElementById('app').classList.add('walkthrough-active');
    walkthroughWeek = 0;
    updateWalkthrough();
  } else {
    bar.classList.add('hidden');
    btn.classList.remove('bg-teal', 'text-white');
    btn.classList.add('bg-white/10', 'text-gray-200');
    document.getElementById('app').classList.remove('walkthrough-active');
    highlightedWeek = null;
    render();
  }
}

function walkthroughPrev() {
  const weeks = getFilteredWeeks();
  const idx = weeks.findIndex(w => w.id === walkthroughWeek);
  if (idx > 0) { walkthroughWeek = weeks[idx - 1].id; updateWalkthrough(); }
}

function walkthroughNext() {
  const weeks = getFilteredWeeks();
  const idx = weeks.findIndex(w => w.id === walkthroughWeek);
  if (idx < weeks.length - 1) { walkthroughWeek = weeks[idx + 1].id; updateWalkthrough(); }
}

function updateWalkthrough() {
  const week = PROGRAM_DATA.weeks[walkthroughWeek];
  const sprint = getSprintForWeek(week.id);
  document.getElementById('wtTitle').textContent = `N\u00E4dal ${week.id}: ${week.name}`;
  document.getElementById('wtSubtitle').textContent = `Sprint ${sprint.id}: ${sprint.name} | ${week.shuHaRi} | ${week.character}`;

  const tp = document.getElementById('wtTalkingPoints');
  if (week.mentorTalkingPoints && week.mentorTalkingPoints.length > 0) {
    tp.classList.remove('hidden');
    tp.innerHTML = `<div class="font-semibold text-white/80 mb-1 text-xs">Mentori vestluspunktid:</div>
      <ul class="space-y-1">${week.mentorTalkingPoints.map(p => `<li class="text-white/90">\u2022 ${p}</li>`).join('')}</ul>`;
  } else {
    tp.classList.add('hidden');
  }

  highlightedWeek = week.id;
  render();
}

// ============ WEEK DETAIL PANEL ============

function openDetailPanel(weekId) {
  const week = PROGRAM_DATA.weeks[weekId];
  const sprint = getSprintForWeek(weekId);
  document.getElementById('detailTitle').textContent = `N\u00E4dal ${week.id}: ${week.name}`;

  let html = '';

  // Header section
  html += `<div class="flex items-center gap-2 mb-4">
    ${shuHaRiBadge(week.shuHaRi)}
    <span class="text-xs text-gray-500">Sprint ${sprint.id}: ${sprint.name}</span>
    <span class="text-xs text-gray-500">|</span>
    <span class="text-xs font-medium">${week.character}</span>
  </div>`;

  // Narrative
  html += `<div class="bg-gray-50 rounded-lg p-3 mb-4">
    <div class="font-semibold text-sm mb-1">${week.narrativeTitle}</div>
    <div class="text-xs italic text-gray-600">\u201C${week.characterQuote}\u201D</div>
    <div class="text-xs text-gray-500 mt-1">${week.emotionalArc}</div>
  </div>`;

  // Sessions
  html += `<div class="mb-4">

function renderRow(label, cells, bgClass, weeks) {
  let html = `<tr class="${bgClass}">`;
  html += `<td class="p-2 font-medium text-[11px] border-b border-gray-100 ${bgClass}">${label}</td>`;
  cells.forEach((cell, i) => {
    const w = weeks[i];
    const sb = isSprintBoundary(w.id) ? 'sprint-border-right' : '';
    const hl = highlightedWeek === w.id ? 'col-highlight' : '';
    const wt = walkthroughActive ? (highlightedWeek === w.id ? 'wt-highlight' : 'wt-dimmed') : '';
    html += `<td class="p-2 border-b border-gray-100 text-center align-top ${sb} ${hl} ${wt}">${cell}</td>`;
  });
  html += '</tr>';
  return html;
}

function renderCategoryHeader(catId, label, weeks) {
  const isExpanded = expandedCategories.has(catId);
  const icon = isExpanded ? '\u25BC' : '\u25B6';
  return `<tr class="category-header bg-gray-100 border-t border-gray-200" onclick="toggleCategory('${catId}')">
    <td class="p-2 font-semibold text-[11px] bg-gray-100" colspan="${weeks.length + 1}">
      <span class="mr-1 text-[9px]">${icon}</span> ${label}
    </td></tr>`;
}

function renderCategoryRow(catId, label, cells, weeks) {
  const isExpanded = expandedCategories.has(catId);
  const hidden = isExpanded ? '' : 'style="display:none;"';
  let html = `<tr class="category-child-${catId}" ${hidden}>`;
  html += `<td class="p-2 pl-6 text-[10px] text-gray-600 border-b border-gray-50 bg-white">${label}</td>`;
  cells.forEach((cell, i) => {
    const w = weeks[i];
    const sb = isSprintBoundary(w.id) ? 'sprint-border-right' : '';
    const hl = highlightedWeek === w.id ? 'col-highlight' : '';
    const wt = walkthroughActive ? (highlightedWeek === w.id ? 'wt-highlight' : 'wt-dimmed') : '';
    html += `<td class="p-2 border-b border-gray-50 align-top ${sb} ${hl} ${wt}">${cell}</td>`;
  });
  html += '</tr>';
  return html;
}

function toggleCategory(catId) {
  if (expandedCategories.has(catId)) expandedCategories.delete(catId);
  else expandedCategories.add(catId);
  render();
}

// ============ KEYBOARD SHORTCUTS ============

document.addEventListener('keydown', (e) => {
  if (walkthroughActive) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); walkthroughNext(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); walkthroughPrev(); }
    if (e.key === 'Escape') { toggleWalkthrough(); }
  } else {
    if (e.key === 'Escape') { closeDetailPanel(); }
  }
});

document.addEventListener('DOMContentLoaded', init);
